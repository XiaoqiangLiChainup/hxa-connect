# Mode drop-in for the existing hxa-codex-worker.service, not a second service.
# Install the additive non-secret environment file first. Replace only the
# operator-recorded persistent mode override; inspect other drop-ins for
# competing commands. Default: local readiness only, with no task or model call.
[Service]
EnvironmentFile=/etc/hxa-codex-worker/zylos-task.env
ExecStartPre=
ExecStart=
ExecStart=/opt/hxa-codex-worker/node/bin/node /opt/hxa-codex-worker/current/scripts/zylos-worker.mjs --check

# For the already-approved one-shot, replace the same recorded mode override
# with the explicit precheck and --zylos --once contents in the runbook, then
# restore and verify this check-only mode after the attempt. Do not enable the
# service or remove this drop-in: the base unit starts the independent Codex
# worker. Preserve all inherited isolation and resource settings.
